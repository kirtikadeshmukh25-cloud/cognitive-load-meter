<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cognitive Load Meter — App</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://unpkg.com/compromise"></script>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/themes.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body class="app-body">

  <header class="app-topbar">
    <a href="index.html" class="brand">
      <i data-lucide="brain"></i>
      <span>Cognitive Load Meter</span>
    </a>
    <div class="app-actions">
      <a href="index.html" class="btn ghost">
        <i data-lucide="home"></i> Home
      </a>
      <button id="exportPdf" class="icon-btn" title="Export PDF">
        <i data-lucide="download"></i>
      </button>
      <button id="copySummary" class="icon-btn" title="Copy summary">
        <i data-lucide="clipboard-copy"></i>
      </button>
    </div>
  </header>

  <main class="app-layout">

    <section class="panel input-panel">
      <div class="panel-header">
        <h2><i data-lucide="file-text"></i> Your Text</h2>
        <span id="wordCounter" class="badge">0 words</span>
      </div>
      <textarea id="textInput" placeholder="Paste or type your text here..."></textarea>
      <div class="input-actions">
        <button id="analyzeBtn" class="btn primary">
          <i data-lucide="scan-text"></i> Analyze
        </button>
        <button id="clearBtn" class="btn ghost">
          <i data-lucide="trash-2"></i> Clear
        </button>
        <button id="sampleBtn" class="btn ghost">
          <i data-lucide="sparkles"></i> Sample text
        </button>
      </div>
    </section>

    <section class="panel results-panel" id="resultsPanel" hidden>
      <div class="score-grid">
        <div class="score-card">
          <span class="score-label">Flesch Reading Ease</span>
          <span class="score-value" id="scoreFlesch">--</span>
          <span class="score-desc" id="descFlesch">--</span>
        </div>
        <div class="score-card">
          <span class="score-label">Grade Level</span>
          <span class="score-value" id="scoreGrade">--</span>
          <span class="score-desc" id="descGrade">--</span>
        </div>
        <div class="score-card">
          <span class="score-label">Gunning Fog</span>
          <span class="score-value" id="scoreFog">--</span>
          <span class="score-desc" id="descFog">--</span>
        </div>
        <div class="score-card">
          <span class="score-label">SMOG Index</span>
          <span class="score-value" id="scoreSmog">--</span>
          <span class="score-desc" id="descSmog">--</span>
        </div>
      </div>

      <div class="stats-chart">
        <div class="stats">
          <h3><i data-lucide="bar-chart-3"></i> Statistics</h3>
          <ul class="stat-list" id="statList"></ul>
        </div>
        <div class="chart-wrap">
          <h3><i data-lucide="radar"></i> Cognitive Profile</h3>
          <canvas id="radarChart"></canvas>
        </div>
      </div>

      <div class="heatmap-section">
        <h3>
          <i data-lucide="thermometer"></i> Sentence Heatmap
          <span class="legend">
            <span class="dot easy"></span> Easy
            <span class="dot medium"></span> Medium
            <span class="dot hard"></span> Hard
          </span>
        </h3>
        <div class="heatmap" id="heatmap"></div>
      </div>

      <div class="suggestions-section">
        <h3><i data-lucide="lightbulb"></i> Suggestions</h3>
        <ul class="suggestion-list" id="suggestionList"></ul>
      </div>
    </section>

  </main>

  <div class="toast" id="toast">
    <i data-lucide="check-circle"></i>
    <span id="toastText">Done</span>
  </div>

  <script src="js/analyzer.js"></script>
  <script src="js/readability.js"></script>
  <script src="js/heatmap.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/suggestions.js"></script>
  <script src="js/export.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
